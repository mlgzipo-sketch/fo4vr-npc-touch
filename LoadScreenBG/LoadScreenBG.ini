; LoadScreenBG: puts the flat game's loading screen backdrop behind the
; spinning model in Fallout 4 VR's loading screens.

; 0 turns the plugin off.
bEnabled=1

; Mesh with the backdrop, relative to Data\Meshes. If it is missing, the game's
; own Interface\Objects\LoadScreen\LoadScreen02.nif is used.
sModel=LoadScreenBG\Background.nif

; How far the picture stands from you, in game units (70 units is about 1 m).
fDistance=900

; How wide the picture looks, in degrees. Bigger fills more of your view.
fWidthDegrees=110

; Moves the picture up (+) or down (-), in game units.
fHeightOffset=0

; 1 also shows the flat game's dark frame overlay (it sits right in front of
; your eyes in VR, so it is off by default).
bShowOverlay=0

; How the picture's rotation is worked out. 0 picks it by itself on the first
; loading screen (see the log); 1 and 2 force one of the two ways.
iRotationMode=0

; 1 draws the picture before the loading text so the text stays on top.
bDrawFirst=1

; 1 writes details to Documents\My Games\Fallout4VR\F4SE\LoadScreenBG.log.
bDebugLog=1
