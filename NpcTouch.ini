; NpcTouch settings. Lines starting with ; are comments. 1 = on, 0 = off.
[Reactions]
; NPCs react to being touched at all.
bEnableReactions=1
; A regular NPC who is touched too much starts a fight (off for now). Companions never do.
bAllowCombat=0
; Companions comment on touches with their own lines.
bCompanionsSpeak=1
; Annoyance per touch: arm/shoulder/back 1, head 2, chest/pelvis 4.
; From this annoyance the NPC warns you.
fAnnoyanceForWarning=3
; From this annoyance the NPC attacks (if bAllowCombat=1).
fAnnoyanceForCombat=8
; How fast annoyance fades, per minute.
fAnnoyanceDecayPerMinute=4
; Minimum seconds between two lines from the same NPC.
fSpeechCooldownSeconds=4
; How long the NPC keeps looking at you after a touch.
fLookAtSeconds=3
; Companions: chest/pelvis touches are welcome from this affinity on (1000 = "Idolizes").
; A romanced companion always welcomes them.
fCloseAffinity=1000
; Game dialogue topics (hex form IDs from Fallout4.esm) a regular NPC says on a touch.
; List several separated by commas; one is picked at random each time.
; First touches: "Хм?", "Что?", "Чего?", "Эй...", "А?", "Да?", "Уф!".
sLineTopics=0003D77F,000D101E,000219CC
; Once annoyed (or touched on chest/pelvis): "Больше так не делай.", "Я все вижу!", "Чертовы карманники!".
sWarningTopics=000D14A6,000711BB

; How far NPCs step away when you bump into them (the game uses 75-128).
; 0 keeps them in place so you can touch and grab them; -1 keeps the game's values.
fBumpMoveDistance=0

[Shoves]
; A fast hand pushes the NPC: they stagger in the direction of the push.
bEnableShoves=1
; Hand speed (game units per second) needed to shove. A calm touch is 5-40.
fShoveSpeed=75
; An even faster hit knocks the NPC over. Companions only stagger.
bEnableKnockdowns=0
fKnockdownSpeed=180
; How hard the knockdown throws them.
fKnockdownForce=1

[Collision]
; ROCK's physical hands stop against NPCs: invisible capsules follow each
; nearby NPC's torso, shoulders, head, arms and legs.
; Needs npcDynamicCollisions = true in ROCK.ini.
bHandsCollideWithNPCs=1
; NPCs closer than this (game units, about 2 m) get invisible bodies.
fProxyRange=150
; Thickness of all capsules: 1 = normal, 1.2 = 20% thicker.
fProxyThickness=1
; Capsules on the legs too.
bProxyLegs=1
; How many of the nearest NPCs get one.
iMaxProxyNPCs=4
; Old experiment: move NPC body parts to the sitting layer. Did not help.
bSwitchBodyLayers=0
fCollisionRadius=200
sClearBodyFlags=00000000
sSetBodyFlags=00000000
bWakeNPCBodies=0

[Grab]
; Grip while a hand touches an NPC holds the touched arm or head.
; Holding the forearm or hand also bends the elbow toward your hand.
bBendElbow=1
; NPCs react to being held: they look at you, warn you, and pull free once
; annoyed enough. Companions don't mind. Head counts double, chest/pelvis triple.
bGrabReactions=1
fGrabAnnoyancePerSecond=0.6
fBreakFreeAnnoyance=6
