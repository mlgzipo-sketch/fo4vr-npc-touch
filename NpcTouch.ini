; NpcTouch settings. Lines starting with ; are comments. 1 = on, 0 = off.
[Reactions]
; NPCs react to being touched at all.
bEnableReactions=1
; A regular NPC who is touched too much starts a fight (off for now). Companions never do.
bAllowCombat=0
; Companions comment on touches with their own lines.
bCompanionsSpeak=1
; Annoyance per touch: arm/shoulder/back 1, head 2, chest/pelvis 4.
; From this annoyance the NPC warns you.
fAnnoyanceForWarning=3
; From this annoyance the NPC attacks (if bAllowCombat=1).
fAnnoyanceForCombat=8
; How fast annoyance fades, per minute.
fAnnoyanceDecayPerMinute=4
; Minimum seconds between two lines from the same NPC.
fSpeechCooldownSeconds=4
; How long the NPC keeps looking at you after a touch.
fLookAtSeconds=3
; Companions: chest/pelvis touches are welcome from this affinity on (1000 = "Idolizes").
; A romanced companion always welcomes them.
fCloseAffinity=1000
; Game dialogue topics (hex form IDs from Fallout4.esm) a regular NPC says on a touch.
; List several separated by commas; one is picked at random each time.
; First touches: DialogueGeneric "hit" lines.
sLineTopics=000219CC
; Once annoyed (or touched on chest/pelvis): DialogueGenericCitizens "pickpocket caught" lines.
sWarningTopics=000711BB
