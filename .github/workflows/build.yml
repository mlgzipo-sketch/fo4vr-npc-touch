name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup cmake
        uses: lukka/get-cmake@latest

      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $plugins = "package\F4SE\Plugins"
          New-Item -ItemType Directory -Force $plugins | Out-Null
          Copy-Item build\Release\NpcTouch.dll $plugins
          Copy-Item NpcTouch.ini $plugins
          Compress-Archive -Path package\* -DestinationPath NpcTouch.zip
          $lockpick = "package-lockpick\F4SE\Plugins"
          New-Item -ItemType Directory -Force $lockpick | Out-Null
          Copy-Item build\Release\VRLockpick.dll $lockpick
          Copy-Item VRLockpick.ini $lockpick

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: NpcTouch
          path: package

      - name: Upload lockpick mod
        uses: actions/upload-artifact@v4
        with:
          name: VRLockpick
          path: package-lockpick

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          Copy-Item NpcTouch.zip "NpcTouch-$tag.zip"
          gh release create $tag "NpcTouch-$tag.zip" --title "NpcTouch $tag" --notes "Install with Vortex or MO2, or unpack into the game's Data folder. See README for requirements." --prerelease
